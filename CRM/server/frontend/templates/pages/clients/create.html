{% extends "base.html" %}

{% block title %}Новый клиент - CRM{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/clients.css">
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Новый клиент</h1>
    <a href="/clients" class="btn btn-secondary">← К списку</a>
</div>

<div class="form-container">
    <form id="clientForm" class="client-form">
        <!-- Имя -->
        <div class="form-group">
            <label for="name">Имя / Название компании *</label>
            <input type="text" id="name" name="name" required class="form-control">
        </div>
        
        <!-- Контакты (улучшенная версия) -->
        <div class="form-section">
            <h3>📞 Контакты</h3>
            <div id="contacts-container"></div>
            <button type="button" class="btn-add-contact" onclick="addContactGroup()">
                + Добавить контакт
            </button>
            
            <!-- Превью контактов -->
            <div id="preview-container" class="preview-container" style="display: none;">
                <div class="preview-title">📋 Предпросмотр:</div>
                <div id="preview-badges"></div>
            </div>
        </div>

        <!-- Заметки -->
        <div class="form-group">
            <label for="notes">Заметки</label>
            <textarea id="notes" name="notes" rows="3" class="form-control"></textarea>
        </div>

        <!-- Кнопки -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Сохранить</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 Очистить</button>
        </div>
    </form>
</div>

<script>
    let contactCounter = 0;
    const contactsData = {};
    
    // Иконки для типов контактов
    const contactIcons = {
        phone: '📞',
        email: '✉️',
        telegram: '📱',
        whatsapp: '💬',
        vk: '📘',
        avito: '📋',
        other: '🔗'
    };
    
    // Добавление новой группы контакта
    function addContactGroup(contactType = 'phone', contactValue = '') {
        const container = document.getElementById('contacts-container');
        const groupId = `contact-group-${contactCounter++}`;
        
        const group = document.createElement('div');
        group.className = 'contact-group';
        group.id = groupId;
        group.innerHTML = `
            <div class="contact-group-header">
                <select class="contact-type-select" onchange="updateContactPreview(this, '${groupId}')">
                    <option value="phone" ${contactType === 'phone' ? 'selected' : ''}>📞 Телефон</option>
                    <option value="email" ${contactType === 'email' ? 'selected' : ''}>✉️ Email</option>
                    <option value="telegram" ${contactType === 'telegram' ? 'selected' : ''}>📱 Telegram</option>
                    <option value="whatsapp" ${contactType === 'whatsapp' ? 'selected' : ''}>💬 WhatsApp</option>
                    <option value="vk" ${contactType === 'vk' ? 'selected' : ''}>📘 VK</option>
                    <option value="avito" ${contactType === 'avito' ? 'selected' : ''}>📋 Avito</option>
                    <option value="other" ${contactType === 'other' ? 'selected' : ''}>🔗 Другое</option>
                </select>
                <button type="button" onclick="removeContactGroup('${groupId}')">✕</button>
            </div>
            <input type="text" class="contact-value-input" placeholder="Введите значение контакта..." 
                   value="${escapeHtml(contactValue)}" oninput="updateContactPreview(this, '${groupId}')">
        `;
        container.appendChild(group);
        
        // Обновляем данные и превью
        updateContactData();
        updatePreview();
    }
    
    // Удаление группы контакта
    function removeContactGroup(groupId) {
        const group = document.getElementById(groupId);
        if (group) {
            group.remove();
            updateContactData();
            updatePreview();
        }
    }
    
    // Обновление данных контактов из формы
    function updateContactData() {
        const groups = document.querySelectorAll('.contact-group');
        Object.keys(contactsData).forEach(key => delete contactsData[key]);
        
        groups.forEach(group => {
            const select = group.querySelector('.contact-type-select');
            const input = group.querySelector('.contact-value-input');
            const contactType = select.value;
            const contactValue = input.value.trim();
            
            if (contactValue) {
                contactsData[contactType] = contactValue;
            }
        });
    }
    
    // Обновление превью контактов
    function updatePreview() {
        updateContactData();
        const previewContainer = document.getElementById('preview-container');
        const previewBadges = document.getElementById('preview-badges');
        
        const entries = Object.entries(contactsData);
        
        if (entries.length === 0) {
            previewContainer.style.display = 'none';
            return;
        }
        
        previewContainer.style.display = 'block';
        previewBadges.innerHTML = entries.map(([type, value]) => `
            <span class="contact-badge-preview">
                ${contactIcons[type] || '🔗'} ${value}
            </span>
        `).join('');
    }
    
    // Обновление при изменении поля
    function updateContactPreview(element, groupId) {
        updateContactData();
        updatePreview();
    }
    
    // Экранирование HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    
    // Отправка формы через API
    document.getElementById('clientForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value.trim();
        if (!name) {
            alert('Введите имя или название компании');
            return;
        }
        
        const notes = document.getElementById('notes').value.trim() || null;
        
        // Собираем контакты
        updateContactData();
        
        const clientData = {
            name: name,
            contacts: contactsData,
            notes: notes
        };
        
        try {
            const response = await fetch('/api/clients', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(clientData)
            });
            
            if (response.ok) {
                const result = await response.json();
                window.location.href = `/clients/detail/${result.id}`;
            } else {
                const error = await response.json();
                alert('Ошибка: ' + (error.detail || 'Не удалось создать клиента'));
            }
        } catch (error) {
            console.error('Ошибка:', error);
            alert('Ошибка при создании клиента');
        }
    });
    
    // Сброс формы
    function resetForm() {
        document.getElementById('name').value = '';
        document.getElementById('notes').value = '';
        document.getElementById('contacts-container').innerHTML = '';
        Object.keys(contactsData).forEach(key => delete contactsData[key]);
        contactCounter = 0;
        updatePreview();
        addContactGroup(); // Добавляем одну пустую группу
    }
    
    // Инициализация: добавляем одну пустую группу
    addContactGroup();
</script>
{% endblock %}
